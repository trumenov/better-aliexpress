<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/img/logo/BetterAliExpressLogoSquared.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Better AliExpress</title>
  </head>
  <body class="body">
    <header class="header">
      <a href="https://github.com/DerStimmler/better-aliexpress" target="_blank">
        <img src="/img/logo/BetterAliExpressLogoSquared.svg" alt="Better AliExpress Logo" />
      </a>
      <h1>Better AliExpress</h1>
    </header>
    <main class="main">
      <section class="config-container" id="configContainer"></section>
      <section class="spammer-settings" id="spammerSettings" hidden>
        <h2>Price spammers</h2>
        <p>List of sellers caught manipulating product prices.</p>
        <textarea id="spammerTextarea" rows="5" placeholder="123456789,987654321,111111111"></textarea>
        <div class="spammer-actions">
          <button id="spammerSaveBtn">Save</button>
          <span id="spammerSaveStatus"></span>
        </div>
      </section>
    </main>
    <footer class="footer">
      <a href="https://github.com/DerStimmler/better-aliexpress" target="_blank">
        <img src="/img/github-mark.svg" alt="GitHub Logo" />
      </a>
    </footer>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
